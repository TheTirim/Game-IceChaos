<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Chaos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0b1a24;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #132637, #08131c 70%);
      color: #e6f0ff;
    }

    .frame {
      width: min(95vw, 900px);
      text-align: center;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #0d1c27;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .hint {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="game" width="900" height="500" aria-label="Ice Chaos Canvas"></canvas>
    <div class="hint">W/S or ↑/↓ to move • Space/Enter to start • Esc to menu</div>
  </div>

  <script>
    "use strict";

    const USE_SPRITES = true;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;

    const sprites = {
      penguin: new Image(),
      iceberg: new Image(),
      bg: new Image(),
    };

    sprites.bg.src = "assets/bg.png";
    sprites.penguin.src = "assets/penguin.png";
    sprites.iceberg.src = "assets/iceberg.png";

    let spritesReady = false;

    function loadSprites() {
      if (!USE_SPRITES) {
        spritesReady = false;
        return Promise.resolve();
      }

      const toLoad = Object.entries(sprites).map(([key, img]) => {
        return new Promise((resolve, reject) => {
          img.onload = () => resolve({ key, loaded: true });
          img.onerror = () => {
            console.warn(`Failed to load sprite: ${key}`);
            resolve({ key, loaded: false });
          };
        });
      });

      return Promise.all(toLoad).then((results) => {
        spritesReady = results.every((result) => result.loaded);
      });
    }

    const GAME_STATE = {
      MENU: "MENU",
      PLAYING: "PLAYING",
      GAME_OVER: "GAME_OVER",
    };

    const input = {
      up: false,
      down: false,
    };

    let state = GAME_STATE.MENU;
    let obstacles = [];
    let spawnTimer = 0;
    let baseSpeed = 180;
    let worldSpeed = baseSpeed;
    let elapsedTime = 0;
    let highscore = Number.parseFloat(localStorage.getItem("iceChaosHighscore")) || 0;

    let debugEnabled = false;
    let godMode = false;
    let slowMoFactor = 1.0;
    let freeze = false;
    let stepRequested = false;

    const player = {
      x: 120,
      y: 250,
      w: 80,
      h: 80,
      speed: 320,
    };

    let lastTime = 0;
    let fps = 0;
    let frameCounter = 0;
    let fpsTimer = 0;
    let bgX = 0;

    function resetGame() {
      obstacles = [];
      spawnTimer = 0;
      baseSpeed = 180;
      worldSpeed = baseSpeed;
      elapsedTime = 0;
      player.y = CANVAS_H / 2;
      freeze = false;
      stepRequested = false;
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnObstacle(forced = false) {
      const from = Math.random() > 0.5 ? "top" : "bottom";
      const difficultyScale = clamp(1 + (worldSpeed - baseSpeed) * 0.003, 1, 1.6);
      const h = Math.round(randomRange(120, 280) * difficultyScale);
      const img = sprites.iceberg;
      const aspect = img && img.naturalWidth ? img.naturalWidth / img.naturalHeight : 0.5;
      const w = Math.max(28, Math.round(h * aspect));
      const y = from === "bottom" ? CANVAS_H - h : 0;

      obstacles.push({
        x: CANVAS_W + w,
        y,
        w,
        h,
        from,
      });

      if (debugEnabled || forced) {
        console.log("Spawn obstacle", { from, w, h, speed: worldSpeed });
      }

      const baseInterval = clamp(1.2 - (worldSpeed - baseSpeed) * 0.0025, 0.5, 1.2);
      spawnTimer = randomRange(baseInterval, baseInterval + 0.6);
    }

    function aabbIntersect(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function getPlayerAabb() {
      return {
        x: player.x - player.w / 2,
        y: player.y - player.h / 2,
        w: player.w,
        h: player.h,
      };
    }

    function handleGameOver() {
      state = GAME_STATE.GAME_OVER;
      if (elapsedTime > highscore) {
        highscore = elapsedTime;
        localStorage.setItem("iceChaosHighscore", highscore.toFixed(1));
      }
    }

    function update(dt) {
      if (state !== GAME_STATE.PLAYING) {
        return;
      }

      const movement = player.speed * dt;
      if (input.up) {
        player.y -= movement;
      }
      if (input.down) {
        player.y += movement;
      }

      const halfH = player.h / 2;
      player.y = clamp(player.y, 10 + halfH, CANVAS_H - halfH - 10);

      worldSpeed += dt * 3.2;
      elapsedTime += dt;

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
      }

      obstacles = obstacles.filter((obstacle) => obstacle.x + obstacle.w > -40);
      obstacles.forEach((obstacle) => {
        obstacle.x -= worldSpeed * dt;
        if (!godMode && aabbIntersect(getPlayerAabb(), obstacle)) {
          if (debugEnabled) {
            console.log("Collision", { player: { ...player }, obstacle: { ...obstacle } });
          }
          handleGameOver();
        }
      });
    }

    function drawBackground(dt) {
      if (USE_SPRITES && sprites.bg.complete && sprites.bg.naturalWidth > 0) {
        bgX = (bgX - worldSpeed * 0.3 * dt) % CANVAS_W;
        bgX = ((bgX % CANVAS_W) + CANVAS_W) % CANVAS_W;
        ctx.drawImage(sprites.bg, bgX, 0, CANVAS_W, CANVAS_H);
        ctx.drawImage(sprites.bg, bgX + CANVAS_W, 0, CANVAS_W, CANVAS_H);
        return;
      }

      ctx.fillStyle = "#0b2433";
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // TODO: Background/Water rendering here (user will add later)
      ctx.fillStyle = "#0f2b3d";
      ctx.fillRect(0, CANVAS_H * 0.6, CANVAS_W, CANVAS_H * 0.4);
    }

    function drawPlayer() {
      if (USE_SPRITES && sprites.penguin.complete && sprites.penguin.naturalWidth > 0) {
        ctx.drawImage(
          sprites.penguin,
          player.x - player.w / 2,
          player.y - player.h / 2,
          player.w,
          player.h
        );
        return;
      }

      ctx.font = "36px serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("🐧", player.x - 18, player.y - 18);
    }

    function drawObstacle(obstacle) {
      if (USE_SPRITES && sprites.iceberg.complete && sprites.iceberg.naturalWidth > 0) {
        const img = sprites.iceberg;
        // Flip iceberg.png for top spikes (same asset, mirrored vertically)
        ctx.save();
        ctx.translate(obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2);
        if (obstacle.from === "top") {
          ctx.scale(1, -1);
        }
        ctx.drawImage(img, -obstacle.w / 2, -obstacle.h / 2, obstacle.w, obstacle.h);
        ctx.restore();
        return;
      }

      ctx.font = "32px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🧊", obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2);
    }

    function drawHitboxes() {
      const playerBox = getPlayerAabb();
      ctx.strokeStyle = "rgba(255, 0, 0, 0.6)";
      ctx.strokeRect(playerBox.x, playerBox.y, playerBox.w, playerBox.h);
      ctx.strokeStyle = "rgba(0, 200, 255, 0.6)";
      obstacles.forEach((obstacle) => {
        ctx.strokeRect(obstacle.x, obstacle.y, obstacle.w, obstacle.h);
      });
    }

    function drawUI() {
      ctx.fillStyle = "#e6f0ff";
      ctx.font = "18px \"Segoe UI\", sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`Score: ${elapsedTime.toFixed(1)}`, 20, 28);
      ctx.fillText(`Highscore: ${highscore.toFixed(1)}`, 20, 50);

      if (state === GAME_STATE.MENU) {
        ctx.font = "42px \"Segoe UI\", sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Ice Chaos", CANVAS_W / 2, CANVAS_H / 2 - 60);
        ctx.font = "20px \"Segoe UI\", sans-serif";
        ctx.fillText("Press Space or Enter to start", CANVAS_W / 2, CANVAS_H / 2);
      }

      if (state === GAME_STATE.GAME_OVER) {
        ctx.font = "36px \"Segoe UI\", sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Game Over", CANVAS_W / 2, CANVAS_H / 2 - 50);
        ctx.font = "20px \"Segoe UI\", sans-serif";
        ctx.fillText("Press Space or Enter to retry", CANVAS_W / 2, CANVAS_H / 2);
      }
    }

    function drawDebugOverlay() {
      if (!debugEnabled) {
        return;
      }

      const lines = [
        `FPS: ${fps.toFixed(0)}`,
        `gameState: ${state}`,
        `worldSpeed: ${worldSpeed.toFixed(1)}`,
        `spawnTimer: ${spawnTimer.toFixed(2)}`,
        `obstacleCount: ${obstacles.length}`,
        `elapsedTime: ${elapsedTime.toFixed(2)}`,
        `godMode: ${godMode}`,
        `slowMoFactor: ${slowMoFactor}`,
        `freeze: ${freeze}`,
      ];

      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(12, 12, 240, lines.length * 18 + 16);
      ctx.fillStyle = "#8fe3ff";
      ctx.font = "14px \"Segoe UI\", monospace";
      ctx.textAlign = "left";
      lines.forEach((line, index) => {
        ctx.fillText(line, 20, 30 + index * 18);
      });

      drawHitboxes();
    }

    function render(dt) {
      drawBackground(dt);
      obstacles.forEach(drawObstacle);
      drawPlayer();
      drawUI();
      drawDebugOverlay();
    }

    function gameLoop(timestamp) {
      const rawDt = Math.min((timestamp - lastTime) / 1000, 0.08);
      lastTime = timestamp;

      let dt = rawDt * slowMoFactor;
      if (freeze && !stepRequested) {
        dt = 0;
      }

      update(dt);
      render(dt);

      if (freeze && stepRequested) {
        stepRequested = false;
      }

      frameCounter += 1;
      fpsTimer += rawDt;
      if (fpsTimer >= 0.5) {
        fps = frameCounter / fpsTimer;
        frameCounter = 0;
        fpsTimer = 0;
      }

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      resetGame();
      state = GAME_STATE.PLAYING;
    }

    function returnToMenu() {
      state = GAME_STATE.MENU;
      resetGame();
    }

    document.addEventListener("keydown", (event) => {
      switch (event.code) {
        case "ArrowUp":
        case "KeyW":
          input.up = true;
          break;
        case "ArrowDown":
        case "KeyS":
          input.down = true;
          break;
        case "Space":
        case "Enter":
          if (state === GAME_STATE.MENU || state === GAME_STATE.GAME_OVER) {
            startGame();
          }
          break;
        case "Escape":
          returnToMenu();
          break;
        case "F3":
        case "KeyD":
          debugEnabled = !debugEnabled;
          break;
        case "KeyG":
          godMode = !godMode;
          break;
        case "Digit1":
          slowMoFactor = 1.0;
          break;
        case "Digit2":
          slowMoFactor = 0.5;
          break;
        case "Digit3":
          slowMoFactor = 0.25;
          break;
        case "KeyP":
          freeze = !freeze;
          break;
        case "KeyO":
          if (freeze) {
            stepRequested = true;
          }
          break;
        case "KeyT":
          if (debugEnabled) {
            spawnObstacle(true);
          }
          break;
        default:
          break;
      }
    });

    document.addEventListener("keyup", (event) => {
      switch (event.code) {
        case "ArrowUp":
        case "KeyW":
          input.up = false;
          break;
        case "ArrowDown":
        case "KeyS":
          input.down = false;
          break;
        default:
          break;
      }
    });

    loadSprites()
      .then(() => {
        requestAnimationFrame((timestamp) => {
          lastTime = timestamp;
          requestAnimationFrame(gameLoop);
        });
      })
      .catch((error) => {
        console.error(error);
        requestAnimationFrame(gameLoop);
      });
  </script>
</body>
</html>
