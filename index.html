<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Chaos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #0b1a24;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #132637, #08131c 70%);
      color: #e6f0ff;
    }

    .frame {
      width: min(95vw, 900px);
      text-align: center;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      background: #0d1c27;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
    }

    .hint {
      margin-top: 12px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    #imprint {
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.7;
      color: rgba(240, 248, 255, 0.8);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="frame">
    <canvas id="game" width="900" height="500" aria-label="Ice Chaos Canvas"></canvas>
    <div class="hint">W/S or ↑/↓, A/D or ←/→ to move • Space/Enter to start • H for highscores • Esc to menu</div>
    <div id="imprint">© 2026 theTirim</div>
  </div>

  <script>
    "use strict";

    const USE_SPRITES = true;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;

    const sprites = {
      penguin: new Image(),
      iceberg: new Image(),
      bg: new Image(),
      snowball: new Image(),
    };

    sprites.bg.src = "assets/bg.png";
    sprites.penguin.src = "assets/penguin.png";
    sprites.iceberg.src = "assets/iceberg.png";
    sprites.snowball.src = "assets/snowball.png";

    let spritesReady = false;

    function loadSprites() {
      if (!USE_SPRITES) {
        spritesReady = false;
        return Promise.resolve();
      }

      const toLoad = Object.entries(sprites).map(([key, img]) => {
        return new Promise((resolve, reject) => {
          img.onload = () => resolve({ key, loaded: true });
          img.onerror = () => {
            console.warn(`Failed to load sprite: ${key}`);
            resolve({ key, loaded: false });
          };
        });
      });

      return Promise.all(toLoad).then((results) => {
        spritesReady = results.every((result) => result.loaded);
      });
    }

    const GAME_STATE = {
      MENU: "MENU",
      PLAYING: "PLAYING",
      GAME_OVER: "GAME_OVER",
      HIGHSCORES: "HIGHSCORES",
    };

    const input = {
      up: false,
      down: false,
      left: false,
      right: false,
    };

    let state = GAME_STATE.MENU;
    let obstacles = [];
    let spawnTimer = 0;
    const WORLD_SPEED_START = 420;
    const WORLD_SPEED_MAX = 820;
    let worldSpeed = WORLD_SPEED_START;
    let elapsedTime = 0;
    let highscores = [];
    let isEnteringName = false;
    let nameInput = "";
    let lastScore = 0;
    let quitHint = "";
    let quitHintTimer = 0;

    let debugEnabled = false;
    let godMode = false;
    let slowMoFactor = 1.0;
    let freeze = false;
    let stepRequested = false;
    let runId = `run-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    let totalFrameIndex = 0;

    const ICE_SPIKE_DEBUG_RING_KEY = "iceChaosIceSpikeDebugRing";
    const ICE_SPIKE_DEBUG_RING_MAX = 200;
    let iceSpikeDebugRing = [];

    const mouse = {
      x: 0,
      y: 0,
      inside: false,
    };

    let currentButtons = [];

    const player = {
      x: 120,
      y: 250,
      w: 80,
      h: 80,
    };

    const PLAYER_SPEED_X = 520;
    const PLAYER_SPEED_Y = 520;

    const PLAYER_COLLIDER_SCALE_X = 0.78;
    const PLAYER_COLLIDER_SCALE_Y = 0.78;
    const PLAYER_COLLIDER_OFFSET_X = 0;
    const PLAYER_COLLIDER_OFFSET_Y = 0;

    const ICE_COLLIDER_SCALE_X_TOP = 0.48;
    const ICE_COLLIDER_SCALE_X_BOTTOM = 0.62;
    const ICE_COLLIDER_SCALE_Y = 0.9;
    const ICE_COLLIDER_OFFSET_X = 0;
    const ICE_COLLIDER_OFFSET_Y = 0;

    let lastTime = 0;
    let fps = 0;
    let frameCounter = 0;
    let fpsTimer = 0;

    const SNOWFLAKE_COUNT = 48;
    const snowflakes = [];

    function createSnowflake(randomY = true) {
      return {
        x: randRange(0, CANVAS_W),
        y: randomY ? randRange(0, CANVAS_H) : randRange(-CANVAS_H * 0.15, -12),
        r: randRange(1.2, 3.4),
        speedY: randRange(12, 30),
        drift: randRange(4, 16),
        phase: randRange(0, Math.PI * 2),
        phaseSpeed: randRange(0.2, 0.6),
        alpha: randRange(0.38, 0.78),
      };
    }

    function initSnowflakes() {
      snowflakes.length = 0;
      for (let i = 0; i < SNOWFLAKE_COUNT; i += 1) {
        snowflakes.push(createSnowflake(true));
      }
    }

    function resetGame() {
      obstacles = [];
      spawnTimer = 0;
      worldSpeed = WORLD_SPEED_START;
      elapsedTime = 0;
      runId = `run-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
      player.x = 120;
      player.y = CANVAS_H / 2;
      freeze = false;
      stepRequested = false;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function clamp01(value) {
      return clamp(value, 0, 1);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function randRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function drawImageCover(ctx, img, x, y, w, h) {
      const imgW = img.naturalWidth || img.width;
      const imgH = img.naturalHeight || img.height;
      if (!imgW || !imgH) {
        return;
      }
      const scale = Math.max(w / imgW, h / imgH);
      const drawW = imgW * scale;
      const drawH = imgH * scale;
      const dx = x + (w - drawW) / 2;
      const dy = y + (h - drawH) / 2;
      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    function drawPanel(x, y, w, h) {
      ctx.save();
      ctx.fillStyle = "rgba(0,0,0,0.55)";
      ctx.strokeStyle = "rgba(255,255,255,0.15)";
      ctx.lineWidth = 1;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.restore();
    }

    function applyUITextStyle() {
      ctx.fillStyle = "rgba(240,248,255,0.95)";
      ctx.shadowColor = "rgba(0,0,0,0.6)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 2;
    }

    function resetUITextStyle() {
      ctx.shadowColor = "transparent";
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
    }

    function loadHighscores() {
      const raw = localStorage.getItem("iceChaosHighscores");
      if (!raw) {
        return [];
      }
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        console.warn("Failed to parse highscores", error);
        return [];
      }
    }

    function saveHighscores(list) {
      localStorage.setItem("iceChaosHighscores", JSON.stringify(list));
    }

    function getBestScore() {
      return highscores.length > 0 ? highscores[0].score : 0;
    }

    function isHighscore(score) {
      if (highscores.length < 10) {
        return true;
      }
      const worst = highscores[highscores.length - 1]?.score ?? 0;
      return score > worst;
    }

    function addHighscore(name, score) {
      const entryName = name.trim() || "Player";
      const entry = {
        name: entryName,
        score,
        date: new Date().toISOString(),
      };
      const next = [...highscores, entry]
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
      highscores = next;
      saveHighscores(next);
    }

    function getMaxSnowballs(timeElapsed) {
      return Math.max(1, Math.floor(timeElapsed / 10));
    }

    function loadIceSpikeDebugRing() {
      try {
        const raw = localStorage.getItem(ICE_SPIKE_DEBUG_RING_KEY);
        if (!raw) {
          return;
        }
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          iceSpikeDebugRing = parsed.slice(-ICE_SPIKE_DEBUG_RING_MAX);
        }
      } catch (error) {
        console.warn("Failed to load ice spike debug ring", error);
      }
    }

    function persistIceSpikeDebugRing() {
      try {
        localStorage.setItem(ICE_SPIKE_DEBUG_RING_KEY, JSON.stringify(iceSpikeDebugRing));
      } catch (error) {
        // localStorage may be unavailable in some contexts.
      }
    }

    function logIceSpikeSpawnDebug(data) {
      const event = {
        timestamp: new Date().toISOString(),
        runId,
        frameIndex: totalFrameIndex,
        obstacleType: "IceSpike",
        ...data,
      };
      iceSpikeDebugRing.push(event);
      if (iceSpikeDebugRing.length > ICE_SPIKE_DEBUG_RING_MAX) {
        iceSpikeDebugRing.splice(0, iceSpikeDebugRing.length - ICE_SPIKE_DEBUG_RING_MAX);
      }
      persistIceSpikeDebugRing();
      console.warn("IceSpike spawn outlier", event);
    }

    function getIceSpikeMetrics(iceberg) {
      const collider = getObstacleCollider(iceberg);
      const playerColliderWidth = getPlayerCollider().w;
      const maxAllowedWidth = playerColliderWidth * 2.0;
      const outlier = collider.w > maxAllowedWidth;
      return {
        collider,
        playerColliderWidth,
        maxAllowedWidth,
        outlier,
      };
    }

    function buildIceSpikeDebugData(iceberg, spawnMeta, metrics, reason, clampFactor = 1) {
      const spritePixelW = sprites.iceberg?.naturalWidth || null;
      const spritePixelH = sprites.iceberg?.naturalHeight || null;
      const pixelsPerUnit = null;
      const spriteWorldWidthExpected =
        pixelsPerUnit && spritePixelW ? spritePixelW / pixelsPerUnit : null;
      const unitMismatch =
        spriteWorldWidthExpected != null && Math.abs(spriteWorldWidthExpected - iceberg.w) > 0.25;

      return {
        reason,
        position: { x: iceberg.x, y: iceberg.y },
        from: iceberg.from,
        prefabBaseScale: { x: 1, y: 1 },
        initialTransformScale: { x: 1, y: 1 },
        runtimeAppliedScale: { x: spawnMeta.runtimeScale, y: spawnMeta.runtimeScale },
        finalTransformScale: {
          x: spawnMeta.runtimeScale * clampFactor,
          y: spawnMeta.runtimeScale * clampFactor,
        },
        spritePixelSize: { w: spritePixelW, h: spritePixelH },
        spriteWorldSize: { w: iceberg.w, h: iceberg.h },
        colliderWorldSize: { w: metrics.collider.w, h: metrics.collider.h },
        pixelsPerUnit,
        rngRawValue: spawnMeta.rngRaw,
        computedScale: spawnMeta.runtimeScale,
        scaleRange: {
          min: spawnMeta.scaleMin,
          max: spawnMeta.scaleMax,
        },
        maxAllowedWidth: metrics.maxAllowedWidth,
        clampFactor,
        rerollCount: spawnMeta.rerollCount,
        warnings: {
          unitMismatch: unitMismatch ? "UNIT_MISMATCH" : null,
          doubleScaleSuspect:
            spawnMeta.prefabBaseScale !== 1 && spawnMeta.runtimeScale !== 1
              ? "DOUBLE_SCALE_SUSPECT"
              : null,
          widthOutlier: metrics.outlier,
          maxAllowedWidthSource: "fallback: playerColliderWidth * 2.0",
        },
      };
    }

    function spawnObstacle(forced = false) {
      const wantsSnowball = Math.random() < 0.3;
      const currentSnowballs = obstacles.filter((obstacle) => obstacle.type === "snowball").length;
      const maxSnowballs = getMaxSnowballs(elapsedTime);
      const isSnowball = wantsSnowball && currentSnowballs < maxSnowballs;

      if (isSnowball) {
        let y = randRange(80, CANVAS_H - 80);
        let tries = 0;
        while (Math.abs(y - player.y) < 60 && tries < 5) {
          y = randRange(80, CANVAS_H - 80);
          tries += 1;
        }
        const size = Math.round(randRange(40, 56));
        obstacles.push({
          type: "snowball",
          x: CANVAS_W + 40,
          y,
          w: size,
          h: size,
          vx: worldSpeed * 1.05,
          vy: (Math.random() < 0.5 ? -1 : 1) * randRange(140, 240),
        });
      } else {
        const from = Math.random() > 0.5 ? "top" : "bottom";
        const difficultyScale = clamp(1 + (worldSpeed - WORLD_SPEED_START) * 0.003, 1, 1.6);
        const img = sprites.iceberg;
        const hasValidImageRatio = img && img.naturalWidth > 0 && img.naturalHeight > 0;
        const aspect = hasValidImageRatio ? img.naturalWidth / img.naturalHeight : 0.5;
        const minScaledH = 120 * difficultyScale;
        const maxScaledH = 280 * difficultyScale;

        let chosenIceberg = null;
        let spawnMeta = null;
        let metrics = null;

        for (let attempt = 0; attempt < 2; attempt += 1) {
          const rngRaw = Math.random();
          const sampledH = minScaledH + rngRaw * (maxScaledH - minScaledH);
          const h = Math.round(sampledH);
          const w = Math.max(28, Math.round(h * aspect));
          const y = from === "bottom" ? CANVAS_H - h : 0;
          const iceberg = {
            type: "iceberg",
            x: CANVAS_W + w,
            y,
            w,
            h,
            from,
          };
          const currentMetrics = getIceSpikeMetrics(iceberg);
          const currentSpawnMeta = {
            rngRaw,
            runtimeScale: sampledH / 280,
            scaleMin: minScaledH / 280,
            scaleMax: maxScaledH / 280,
            prefabBaseScale: 1,
            rerollCount: attempt,
          };

          chosenIceberg = iceberg;
          metrics = currentMetrics;
          spawnMeta = currentSpawnMeta;

          if (!currentMetrics.outlier) {
            break;
          }

          logIceSpikeSpawnDebug(
            buildIceSpikeDebugData(iceberg, currentSpawnMeta, currentMetrics, "OUTLIER_REROLL")
          );
        }

        if (metrics.outlier) {
          const clampFactor = clamp(metrics.maxAllowedWidth / metrics.collider.w, 0, 1);
          chosenIceberg.w *= clampFactor;
          chosenIceberg.h *= clampFactor;
          chosenIceberg.x = CANVAS_W + chosenIceberg.w;
          metrics = getIceSpikeMetrics(chosenIceberg);
          logIceSpikeSpawnDebug(
            buildIceSpikeDebugData(
              chosenIceberg,
              { ...spawnMeta, runtimeScale: spawnMeta.runtimeScale * clampFactor, rerollCount: 2 },
              metrics,
              "OUTLIER_CLAMPED",
              clampFactor
            )
          );
        }

        obstacles.push(chosenIceberg);
      }

      if (debugEnabled || forced) {
        console.log("Spawn obstacle", { type: isSnowball ? "snowball" : "iceberg", speed: worldSpeed });
      }

      const tNorm = clamp01((worldSpeed - WORLD_SPEED_START) / (WORLD_SPEED_MAX - WORLD_SPEED_START));
      const minInterval = lerp(0.85, 0.55, tNorm);
      const maxInterval = lerp(1.25, 0.95, tNorm);
      spawnTimer = randRange(minInterval, maxInterval);
    }

    function aabbIntersect(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function pointInTriangle(px, py, ax, ay, bx, by, cx, cy) {
      const v0x = cx - ax;
      const v0y = cy - ay;
      const v1x = bx - ax;
      const v1y = by - ay;
      const v2x = px - ax;
      const v2y = py - ay;
      const dot00 = v0x * v0x + v0y * v0y;
      const dot01 = v0x * v1x + v0y * v1y;
      const dot02 = v0x * v2x + v0y * v2y;
      const dot11 = v1x * v1x + v1y * v1y;
      const dot12 = v1x * v2x + v1y * v2y;
      const invDenom = 1 / (dot00 * dot11 - dot01 * dot01);
      const u = (dot11 * dot02 - dot01 * dot12) * invDenom;
      const v = (dot00 * dot12 - dot01 * dot02) * invDenom;
      return u >= 0 && v >= 0 && u + v <= 1;
    }

    function rectContainsPoint(rect, px, py) {
      return px >= rect.x && px <= rect.x + rect.w && py >= rect.y && py <= rect.y + rect.h;
    }

    function triIntersectsRect(tri, rect) {
      const rectPoints = [
        { x: rect.x, y: rect.y },
        { x: rect.x + rect.w, y: rect.y },
        { x: rect.x + rect.w, y: rect.y + rect.h },
        { x: rect.x, y: rect.y + rect.h },
      ];
      for (const point of rectPoints) {
        if (
          pointInTriangle(
            point.x,
            point.y,
            tri.ax,
            tri.ay,
            tri.bx,
            tri.by,
            tri.cx,
            tri.cy
          )
        ) {
          return true;
        }
      }
      if (rectContainsPoint(rect, tri.ax, tri.ay)) {
        return true;
      }
      if (rectContainsPoint(rect, tri.bx, tri.by)) {
        return true;
      }
      if (rectContainsPoint(rect, tri.cx, tri.cy)) {
        return true;
      }
      return false;
    }

    function getPlayerRenderBox() {
      return {
        x: player.x - player.w / 2,
        y: player.y - player.h / 2,
        w: player.w,
        h: player.h,
      };
    }

    function getPlayerCollider() {
      const cw = player.w * PLAYER_COLLIDER_SCALE_X;
      const ch = player.h * PLAYER_COLLIDER_SCALE_Y;
      return {
        x: player.x - cw / 2 + PLAYER_COLLIDER_OFFSET_X,
        y: player.y - ch / 2 + PLAYER_COLLIDER_OFFSET_Y,
        w: cw,
        h: ch,
      };
    }

    function getObstacleRenderBox(obstacle) {
      return {
        x: obstacle.x,
        y: obstacle.y,
        w: obstacle.w,
        h: obstacle.h,
      };
    }

    function getObstacleCollider(obstacle) {
      if (obstacle.type === "snowball") {
        const scale = 0.7;
        const cw = obstacle.w * scale;
        const ch = obstacle.h * scale;
        return {
          x: obstacle.x + (obstacle.w - cw) / 2,
          y: obstacle.y + (obstacle.h - ch) / 2,
          w: cw,
          h: ch,
        };
      }
      const scaleX =
        obstacle.from === "top" ? ICE_COLLIDER_SCALE_X_TOP : ICE_COLLIDER_SCALE_X_BOTTOM;
      const cw = obstacle.w * scaleX;
      const ch = obstacle.h * ICE_COLLIDER_SCALE_Y;
      return {
        x: obstacle.x + (obstacle.w - cw) / 2 + ICE_COLLIDER_OFFSET_X,
        y: obstacle.y + (obstacle.h - ch) / 2 + ICE_COLLIDER_OFFSET_Y,
        w: cw,
        h: ch,
      };
    }

    function getIcebergParts(obstacle) {
      const bodyW = obstacle.w * 0.55;
      const bodyH = obstacle.h * 0.72;
      const bodyX = obstacle.x + (obstacle.w - bodyW) / 2;
      const bodyY = obstacle.from === "bottom" ? obstacle.y + obstacle.h - bodyH : obstacle.y;
      const tipW = obstacle.w * 0.42;
      const tipH = obstacle.h * 0.3;
      const tipXCenter = obstacle.x + obstacle.w / 2;
      let ax;
      let ay;
      let bx;
      let by;
      let cx;
      let cy;
      if (obstacle.from === "bottom") {
        ax = tipXCenter;
        ay = obstacle.y;
        bx = tipXCenter - tipW / 2;
        by = obstacle.y + tipH;
        cx = tipXCenter + tipW / 2;
        cy = obstacle.y + tipH;
      } else {
        ax = tipXCenter;
        ay = obstacle.y + obstacle.h;
        bx = tipXCenter - tipW / 2;
        by = obstacle.y + obstacle.h - tipH;
        cx = tipXCenter + tipW / 2;
        cy = obstacle.y + obstacle.h - tipH;
      }
      return {
        bodyRect: {
          x: bodyX,
          y: bodyY,
          w: bodyW,
          h: bodyH,
        },
        tipTri: { ax, ay, bx, by, cx, cy },
      };
    }

    function handleGameOver() {
      state = GAME_STATE.GAME_OVER;
      lastScore = elapsedTime;
      if (isHighscore(elapsedTime)) {
        isEnteringName = true;
        nameInput = "";
      } else {
        isEnteringName = false;
      }
    }

    function update(dt) {
      if (state !== GAME_STATE.PLAYING) {
        return;
      }

      player.x += (input.right - input.left) * PLAYER_SPEED_X * dt;
      player.y += (input.down - input.up) * PLAYER_SPEED_Y * dt;

      const minX = 60;
      const maxX = CANVAS_W * 0.45;
      const minY = 40;
      const maxY = CANVAS_H - 40;
      player.x = clamp(player.x, minX, maxX);
      player.y = clamp(player.y, minY, maxY);

      elapsedTime += dt;
      worldSpeed = WORLD_SPEED_START + elapsedTime * 18;
      worldSpeed = Math.min(worldSpeed, WORLD_SPEED_MAX);

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnObstacle();
      }

      obstacles = obstacles.filter((obstacle) => {
        const cutoff = obstacle.type === "snowball" ? -50 : -40;
        return obstacle.x + obstacle.w > cutoff;
      });
      obstacles.forEach((obstacle) => {
        if (obstacle.type === "snowball") {
          obstacle.x -= obstacle.vx * dt;
          obstacle.y += obstacle.vy * dt;
          const topBound = 60;
          const bottomBound = CANVAS_H - 60 - obstacle.h;
          if (obstacle.y < topBound) {
            obstacle.y = topBound;
            obstacle.vy = Math.abs(obstacle.vy) * randRange(0.85, 1.15);
          }
          if (obstacle.y > bottomBound) {
            obstacle.y = bottomBound;
            obstacle.vy = -Math.abs(obstacle.vy) * randRange(0.85, 1.15);
          }
        } else {
          obstacle.x -= worldSpeed * dt;
        }
        const playerBox = getPlayerCollider();
        let hit = false;
        if (obstacle.type === "iceberg") {
          const parts = getIcebergParts(obstacle);
          hit =
            aabbIntersect(playerBox, parts.bodyRect) ||
            triIntersectsRect(parts.tipTri, playerBox);
        } else {
          const obstacleBox = getObstacleCollider(obstacle);
          hit = aabbIntersect(playerBox, obstacleBox);
        }
        if (!godMode && hit) {
          if (debugEnabled) {
            console.log("Collision", { player: { ...player }, obstacle: { ...obstacle } });
          }
          handleGameOver();
        }
      });
    }

    function updateSnowflakes(dt) {
      snowflakes.forEach((flake) => {
        flake.phase += dt * flake.phaseSpeed;
        flake.y += flake.speedY * dt;
        flake.x += Math.sin(flake.phase) * flake.drift * dt;

        if (flake.y - flake.r > CANVAS_H) {
          Object.assign(flake, createSnowflake(false));
        }

        if (flake.x < -12) {
          flake.x = CANVAS_W + 12;
        } else if (flake.x > CANVAS_W + 12) {
          flake.x = -12;
        }
      });
    }

    function drawBackground(dt) {
      if (USE_SPRITES && sprites.bg.complete && sprites.bg.naturalWidth > 0) {
        drawImageCover(ctx, sprites.bg, 0, 0, CANVAS_W, CANVAS_H);
      } else {
        ctx.fillStyle = "#0b2433";
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        // TODO: Background/Water rendering here (user will add later)
        ctx.fillStyle = "#0f2b3d";
        ctx.fillRect(0, CANVAS_H * 0.6, CANVAS_W, CANVAS_H * 0.4);
      }
      drawSnowflakes();
    }

    function drawSnowflakes() {
      ctx.save();
      snowflakes.forEach((flake) => {
        const glow = flake.r * 2.4;
        const gradient = ctx.createRadialGradient(flake.x, flake.y, 0, flake.x, flake.y, glow);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${flake.alpha})`);
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, glow, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = `rgba(235, 245, 255, ${Math.min(flake.alpha + 0.16, 0.92)})`;
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawPlayer() {
      if (USE_SPRITES && sprites.penguin.complete && sprites.penguin.naturalWidth > 0) {
        ctx.drawImage(
          sprites.penguin,
          player.x - player.w / 2,
          player.y - player.h / 2,
          player.w,
          player.h
        );
        return;
      }

      ctx.font = "36px serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("🐧", player.x - 18, player.y - 18);
    }

    function drawObstacle(obstacle) {
      if (obstacle.type === "snowball") {
        if (USE_SPRITES && sprites.snowball.complete && sprites.snowball.naturalWidth > 0) {
          ctx.drawImage(sprites.snowball, obstacle.x, obstacle.y, obstacle.w, obstacle.h);
          return;
        }
        ctx.save();
        ctx.font = `${obstacle.h}px system-ui`;
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillText("⚪️", obstacle.x, obstacle.y);
        ctx.restore();
        return;
      }
      if (USE_SPRITES && sprites.iceberg.complete && sprites.iceberg.naturalWidth > 0) {
        const img = sprites.iceberg;
        // Flip iceberg.png for top spikes (same asset, mirrored vertically)
        ctx.save();
        ctx.translate(obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2);
        if (obstacle.from === "top") {
          ctx.scale(1, -1);
        }
        ctx.drawImage(img, -obstacle.w / 2, -obstacle.h / 2, obstacle.w, obstacle.h);
        ctx.restore();
        return;
      }

      ctx.font = "32px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("🧊", obstacle.x + obstacle.w / 2, obstacle.y + obstacle.h / 2);
    }

    function drawHitboxes() {
      const playerRenderBox = getPlayerRenderBox();
      const playerColliderBox = getPlayerCollider();
      ctx.save();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 1;
      ctx.strokeRect(
        playerRenderBox.x,
        playerRenderBox.y,
        playerRenderBox.w,
        playerRenderBox.h
      );
      obstacles.forEach((obstacle) => {
        const obstacleRenderBox = getObstacleRenderBox(obstacle);
        ctx.strokeRect(
          obstacleRenderBox.x,
          obstacleRenderBox.y,
          obstacleRenderBox.w,
          obstacleRenderBox.h
        );
      });
      ctx.restore();

      ctx.strokeStyle = "rgba(0, 255, 120, 0.9)";
      ctx.lineWidth = 2;
      ctx.strokeRect(
        playerColliderBox.x,
        playerColliderBox.y,
        playerColliderBox.w,
        playerColliderBox.h
      );
      ctx.strokeStyle = "rgba(255, 80, 80, 0.9)";
      obstacles.forEach((obstacle) => {
        if (obstacle.type === "iceberg") {
          const parts = getIcebergParts(obstacle);
          ctx.strokeStyle = "rgba(255, 214, 102, 0.95)";
          ctx.strokeRect(parts.bodyRect.x, parts.bodyRect.y, parts.bodyRect.w, parts.bodyRect.h);
          ctx.strokeStyle = "rgba(96, 236, 255, 0.95)";
          ctx.beginPath();
          ctx.moveTo(parts.tipTri.ax, parts.tipTri.ay);
          ctx.lineTo(parts.tipTri.bx, parts.tipTri.by);
          ctx.lineTo(parts.tipTri.cx, parts.tipTri.cy);
          ctx.closePath();
          ctx.stroke();
        } else {
          const obstacleColliderBox = getObstacleCollider(obstacle);
          ctx.strokeStyle = "rgba(255, 80, 80, 0.9)";
          ctx.strokeRect(
            obstacleColliderBox.x,
            obstacleColliderBox.y,
            obstacleColliderBox.w,
            obstacleColliderBox.h
          );
        }
      });
    }

    function hitTest(button, x, y) {
      return x >= button.x && x <= button.x + button.w && y >= button.y && y <= button.y + button.h;
    }

    function renderButtons(buttons) {
      currentButtons = buttons;
      buttons.forEach((button) => {
        const hovered = mouse.inside && hitTest(button, mouse.x, mouse.y);
        drawPanel(button.x, button.y, button.w, button.h);
        ctx.save();
        if (hovered) {
          ctx.strokeStyle = "rgba(255,255,255,0.35)";
          ctx.lineWidth = 2;
          ctx.strokeRect(button.x + 1, button.y + 1, button.w - 2, button.h - 2);
        }
        applyUITextStyle();
        ctx.font = "18px \"Segoe UI\", sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(button.label, button.x + button.w / 2, button.y + button.h / 2);
        resetUITextStyle();
        ctx.restore();
      });
    }

    function drawHUD() {
      const panelWidth = 220;
      const panelHeight = 72;
      drawPanel(16, 16, panelWidth, panelHeight);
      applyUITextStyle();
      ctx.font = "16px \"Segoe UI\", sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(`Score: ${elapsedTime.toFixed(1)}s`, 28, 24);
      ctx.fillText(`Best: ${getBestScore().toFixed(1)}s`, 28, 44);
      ctx.fillText("Esc = Menu", 28, 64);
      resetUITextStyle();
    }

    function drawMenu() {
      const panelWidth = 420;
      const panelHeight = 260;
      const panelX = (CANVAS_W - panelWidth) / 2;
      const panelY = (CANVAS_H - panelHeight) / 2 - 20;
      drawPanel(panelX, panelY, panelWidth, panelHeight);
      applyUITextStyle();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "46px \"Segoe UI\", sans-serif";
      ctx.fillText("Ice Chaos", CANVAS_W / 2, panelY + 60);
      ctx.font = "18px \"Segoe UI\", sans-serif";
      ctx.fillText(`Best: ${getBestScore().toFixed(1)}s`, CANVAS_W / 2, panelY + 100);
      if (quitHint) {
        ctx.fillText(quitHint, CANVAS_W / 2, panelY + 130);
      }
      resetUITextStyle();

      const buttonWidth = 180;
      const buttonHeight = 44;
      const spacing = 14;
      const startY = panelY + 150;
      const centerX = CANVAS_W / 2 - buttonWidth / 2;
      const buttons = [
        {
          label: "Start",
          x: centerX,
          y: startY,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => startGame(),
        },
        {
          label: "Highscores",
          x: centerX,
          y: startY + buttonHeight + spacing,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => openHighscores(),
        },
        {
          label: "Quit",
          x: centerX,
          y: startY + (buttonHeight + spacing) * 2,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => showQuitHint(),
        },
      ];
      renderButtons(buttons);
    }

    function drawGameOver() {
      const panelWidth = 460;
      const panelHeight = 260;
      const panelX = (CANVAS_W - panelWidth) / 2;
      const panelY = (CANVAS_H - panelHeight) / 2 - 20;
      drawPanel(panelX, panelY, panelWidth, panelHeight);
      applyUITextStyle();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "36px \"Segoe UI\", sans-serif";
      ctx.fillText("Game Over", CANVAS_W / 2, panelY + 50);
      ctx.font = "18px \"Segoe UI\", sans-serif";
      ctx.fillText(`Score: ${lastScore.toFixed(1)}s`, CANVAS_W / 2, panelY + 90);

      if (isEnteringName) {
        ctx.fillText("New Highscore! Enter your name:", CANVAS_W / 2, panelY + 125);
        const inputWidth = 220;
        const inputHeight = 36;
        const inputX = CANVAS_W / 2 - inputWidth / 2;
        const inputY = panelY + 145;
        drawPanel(inputX, inputY, inputWidth, inputHeight);
        const displayName = nameInput || " ";
        ctx.font = "18px \"Segoe UI\", sans-serif";
        ctx.textBaseline = "middle";
        ctx.fillText(displayName, CANVAS_W / 2, inputY + inputHeight / 2);
      }
      resetUITextStyle();

      const buttonWidth = 150;
      const buttonHeight = 40;
      const spacing = 12;
      const startY = panelY + 190;
      const startX = CANVAS_W / 2 - (buttonWidth * 1.5 + spacing);
      const buttons = [
        {
          label: "Retry",
          x: startX,
          y: startY,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => startGame(),
        },
        {
          label: "Menu",
          x: startX + buttonWidth + spacing,
          y: startY,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => returnToMenu(),
        },
        {
          label: "Highscores",
          x: startX + (buttonWidth + spacing) * 2,
          y: startY,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => openHighscores(),
        },
      ];
      renderButtons(buttons);
    }

    function drawHighscores() {
      const panelWidth = 520;
      const panelHeight = 320;
      const panelX = (CANVAS_W - panelWidth) / 2;
      const panelY = (CANVAS_H - panelHeight) / 2 - 20;
      drawPanel(panelX, panelY, panelWidth, panelHeight);
      applyUITextStyle();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "32px \"Segoe UI\", sans-serif";
      ctx.fillText("Highscores", CANVAS_W / 2, panelY + 40);

      ctx.font = "18px \"Segoe UI\", sans-serif";
      ctx.textAlign = "left";
      const listX = panelX + 40;
      const listY = panelY + 70;
      const lineHeight = 24;
      if (highscores.length === 0) {
        ctx.textAlign = "center";
        ctx.fillText("No highscores yet.", CANVAS_W / 2, listY + 40);
      } else {
        highscores.forEach((entry, index) => {
          const label = `${index + 1}. ${entry.name}`;
          const score = `${entry.score.toFixed(1)}s`;
          ctx.fillText(label, listX, listY + index * lineHeight);
          ctx.textAlign = "right";
          ctx.fillText(score, panelX + panelWidth - 40, listY + index * lineHeight);
          ctx.textAlign = "left";
        });
      }
      resetUITextStyle();

      const buttonWidth = 140;
      const buttonHeight = 40;
      const buttonX = CANVAS_W / 2 - buttonWidth / 2;
      const buttonY = panelY + panelHeight - 60;
      renderButtons([
        {
          label: "Back",
          x: buttonX,
          y: buttonY,
          w: buttonWidth,
          h: buttonHeight,
          onClick: () => returnToMenu(),
        },
      ]);
    }

    function drawUI() {
      currentButtons = [];
      if (state === GAME_STATE.PLAYING) {
        drawHUD();
      } else if (state === GAME_STATE.MENU) {
        drawMenu();
      } else if (state === GAME_STATE.GAME_OVER) {
        drawGameOver();
      } else if (state === GAME_STATE.HIGHSCORES) {
        drawHighscores();
      }
    }

    function drawDebugOverlay() {
      if (!debugEnabled) {
        return;
      }

      const currentSnowballs = obstacles.filter((obstacle) => obstacle.type === "snowball").length;
      const maxSnowballs = getMaxSnowballs(elapsedTime);
      const lines = [
        `FPS: ${fps.toFixed(0)}`,
        `gameState: ${state}`,
        `worldSpeed: ${worldSpeed.toFixed(1)}`,
        `spawnTimer: ${spawnTimer.toFixed(2)}`,
        `obstacleCount: ${obstacles.length}`,
        `snowballCount: ${currentSnowballs}`,
        `maxSnowballs: ${maxSnowballs}`,
        `elapsedTime: ${elapsedTime.toFixed(2)}`,
        `godMode: ${godMode}`,
        `slowMoFactor: ${slowMoFactor}`,
        `freeze: ${freeze}`,
      ];

      ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
      ctx.fillRect(12, 12, 240, lines.length * 18 + 16);
      ctx.fillStyle = "#8fe3ff";
      ctx.font = "14px \"Segoe UI\", monospace";
      ctx.textAlign = "left";
      lines.forEach((line, index) => {
        ctx.fillText(line, 20, 30 + index * 18);
      });

      drawHitboxes();
    }

    function render(dt) {
      drawBackground(dt);
      obstacles.forEach(drawObstacle);
      drawPlayer();
      drawUI();
      drawDebugOverlay();
    }

    function gameLoop(timestamp) {
      const rawDt = Math.min((timestamp - lastTime) / 1000, 0.08);
      lastTime = timestamp;

      let dt = rawDt * slowMoFactor;
      if (freeze && !stepRequested) {
        dt = 0;
      }

      if (quitHintTimer > 0) {
        quitHintTimer = Math.max(quitHintTimer - rawDt, 0);
        if (quitHintTimer === 0) {
          quitHint = "";
        }
      }

      updateSnowflakes(rawDt);
      update(dt);
      render(dt);

      if (freeze && stepRequested) {
        stepRequested = false;
      }

      frameCounter += 1;
      totalFrameIndex += 1;
      fpsTimer += rawDt;
      if (fpsTimer >= 0.5) {
        fps = frameCounter / fpsTimer;
        frameCounter = 0;
        fpsTimer = 0;
      }

      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      resetGame();
      isEnteringName = false;
      state = GAME_STATE.PLAYING;
    }

    function returnToMenu() {
      state = GAME_STATE.MENU;
      isEnteringName = false;
      resetGame();
    }

    function openHighscores() {
      state = GAME_STATE.HIGHSCORES;
    }

    function showQuitHint() {
      quitHint = "Close tab to quit";
      quitHintTimer = 2.5;
    }

    function handleNameInput(event) {
      if (event.code === "Backspace") {
        nameInput = nameInput.slice(0, -1);
        return;
      }
      if (event.code === "Escape") {
        isEnteringName = false;
        returnToMenu();
        return;
      }
      if (event.code === "KeyH") {
        isEnteringName = false;
        openHighscores();
        return;
      }
      if (event.code === "Enter") {
        addHighscore(nameInput, lastScore);
        isEnteringName = false;
        openHighscores();
        return;
      }
      const char = event.key;
      if (char.length !== 1) {
        return;
      }
      if (nameInput.length >= 12) {
        return;
      }
      if (/^[a-z0-9 _-]$/i.test(char)) {
        nameInput += char;
      }
    }

    function updateMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      mouse.x = (event.clientX - rect.left) * scaleX;
      mouse.y = (event.clientY - rect.top) * scaleY;
      mouse.inside = mouse.x >= 0 && mouse.x <= CANVAS_W && mouse.y >= 0 && mouse.y <= CANVAS_H;
    }

    document.addEventListener("keydown", (event) => {
      if (state === GAME_STATE.GAME_OVER && isEnteringName) {
        handleNameInput(event);
        return;
      }

      switch (event.code) {
        case "ArrowUp":
        case "KeyW":
          input.up = true;
          break;
        case "ArrowDown":
        case "KeyS":
          input.down = true;
          break;
        case "ArrowLeft":
        case "KeyA":
          input.left = true;
          break;
        case "ArrowRight":
        case "KeyD":
          input.right = true;
          break;
        case "Space":
        case "Enter":
          if (state === GAME_STATE.MENU || state === GAME_STATE.GAME_OVER) {
            startGame();
          }
          break;
        case "KeyH":
          if (state === GAME_STATE.MENU || state === GAME_STATE.GAME_OVER) {
            openHighscores();
          }
          break;
        case "Escape":
          if (state === GAME_STATE.PLAYING) {
            returnToMenu();
          } else if (state === GAME_STATE.MENU) {
            showQuitHint();
          } else if (state === GAME_STATE.GAME_OVER) {
            returnToMenu();
          } else if (state === GAME_STATE.HIGHSCORES) {
            returnToMenu();
          }
          break;
        case "KeyB":
          if (state === GAME_STATE.HIGHSCORES) {
            returnToMenu();
          }
          break;
        case "F3":
          debugEnabled = !debugEnabled;
          break;
        case "KeyG":
          godMode = !godMode;
          break;
        case "Digit1":
          slowMoFactor = 1.0;
          break;
        case "Digit2":
          slowMoFactor = 0.5;
          break;
        case "Digit3":
          slowMoFactor = 0.25;
          break;
        case "KeyP":
          freeze = !freeze;
          break;
        case "KeyO":
          if (freeze) {
            stepRequested = true;
          }
          break;
        case "KeyT":
          if (debugEnabled) {
            spawnObstacle(true);
          }
          break;
        default:
          break;
      }
    });

    document.addEventListener("keyup", (event) => {
      switch (event.code) {
        case "ArrowUp":
        case "KeyW":
          input.up = false;
          break;
        case "ArrowDown":
        case "KeyS":
          input.down = false;
          break;
        case "ArrowLeft":
        case "KeyA":
          input.left = false;
          break;
        case "ArrowRight":
        case "KeyD":
          input.right = false;
          break;
        default:
          break;
      }
    });

    canvas.addEventListener("mousemove", (event) => {
      updateMousePosition(event);
    });

    canvas.addEventListener("mouseleave", () => {
      mouse.inside = false;
    });

    canvas.addEventListener("click", (event) => {
      updateMousePosition(event);
      if (!currentButtons.length) {
        return;
      }
      const clicked = currentButtons.find((button) => hitTest(button, mouse.x, mouse.y));
      if (clicked && typeof clicked.onClick === "function") {
        clicked.onClick();
      }
    });

    highscores = loadHighscores().sort((a, b) => b.score - a.score).slice(0, 10);
    loadIceSpikeDebugRing();
    initSnowflakes();

    loadSprites()
      .then(() => {
        requestAnimationFrame((timestamp) => {
          lastTime = timestamp;
          requestAnimationFrame(gameLoop);
        });
      })
      .catch((error) => {
        console.error(error);
        requestAnimationFrame(gameLoop);
      });
  </script>
</body>
</html>
